name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests eval
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - run: pnpm typecheck
      - run: pnpm test

  # E2E：真的瀏覽器＋真的前端＋真的 FastAPI（模型、檢索、條文用假的，不需要任何金鑰）。
  # 比較慢，所以只在 push 到 main 時跑，PR 不跑。
  e2e:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
        working-directory: backend
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # 只驗證部署映像「建得起來、跑得起來」。真正的索引不進 git，這裡用空目錄頂替，所以不測問答
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data/index && touch data/index/.placeholder
      - run: docker build -t traffic-law-rag .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 traffic-law-rag
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf localhost:8000/api/health
          curl -sf localhost:8000/eval | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/nope)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/assets/nope.js)" = 404
          docker logs app
