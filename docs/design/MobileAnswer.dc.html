<h1 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 26px; line-height: 1.4;">紅燈右轉會被罰多少錢？</h1>
<div style="border-top: 1px solid var(--rule-strong); padding-top: 14px; display: flex; flex-direction: column; gap: 12px; font-family: 'Noto Serif TC', serif; font-size: 18px; line-height: 1.95;">
<p style="margin: 0;">在設有紅燈的路口，紅燈時右轉通常屬於「闖紅燈」，汽車駕駛人會被處新臺幣 [金額] 元罰鍰 <a href="MobileSources.dc.html" style="display: inline-flex; align-items: center; min-height: 28px; padding: 0 7px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-family: 'Noto Sans TC', sans-serif; font-size: 13px; font-weight: 700; text-decoration: none; vertical-align: 2px;">處罰條例 §53</a>。</p>
<p style="margin: 0;">例外是路口設有允許紅燈右轉的標誌，依指示行駛就不算違規 <a href="MobileSources.dc.html" style="display: inline-flex; align-items: center; min-height: 28px; padding: 0 7px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-family: 'Noto Sans TC', sans-serif; font-size: 13px; font-weight: 700; text-decoration: none; vertical-align: 2px;">道安規則 §102</a>。紅燈時應停在停止線前 <a href="MobileSources.dc.html" style="display: inline-flex; align-items: center; min-height: 28px; padding: 0 7px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-family: 'Noto Sans TC', sans-serif; font-size: 13px; font-weight: 700; text-decoration: none; vertical-align: 2px;">道安規則 §206</a>。</p>
</div>
