<p style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 17px; line-height: 2; color: var(--ink);">1. 汽車駕駛人，行經有燈光號誌管制之交岔路口闖紅燈者，處新臺幣 [金額] 元以上 [金額] 元以下罰鍰。</p>
